<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Fluoroscopy Simulator</title>
<link rel="manifest" href="manifest.json">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #000;
  color: #aaa;
  font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
  overflow: hidden;
  position: fixed;
  inset: 0;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}

/* --- Start screen --- */
#start-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 24px;
}

.app-title {
  font-size: 13px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: #555;
}

#btn-start {
  background: none;
  border: 1px solid #444;
  color: #ccc;
  padding: 18px 56px;
  font: inherit;
  font-size: 16px;
  letter-spacing: 0.12em;
  cursor: pointer;
  border-radius: 4px;
  transition: border-color 0.2s, color 0.2s;
}
#btn-start:hover, #btn-start:focus-visible {
  border-color: #888;
  color: #fff;
  outline: none;
}

.hint {
  font-size: 11px;
  color: #444;
  max-width: 300px;
  text-align: center;
  line-height: 1.7;
}

/* --- Error screen --- */
#error-screen {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 16px;
  padding: 32px;
}
#error-msg {
  font-size: 13px;
  color: #e33;
  line-height: 1.8;
  text-align: center;
  max-width: 400px;
}

/* --- Live screen --- */
#live-screen {
  display: none;
  position: fixed;
  inset: 0;
}

#camera {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  filter: grayscale(1) contrast(1.3) brightness(1.1);
  opacity: 0;
  transition: opacity 0.04s;
}
#camera.exposing { opacity: 1; }
#camera.inverted { filter: grayscale(1) invert(1) contrast(1.3) brightness(1.1); }

#standby-label {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  z-index: 10;
}
#standby-label span {
  font-size: 13px;
  color: #333;
  letter-spacing: 0.22em;
  text-transform: uppercase;
}
#standby-label.hidden span { display: none; }

/* --- Top bar --- */
#top-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 18px;
  z-index: 20;
  pointer-events: none;
  transition: opacity 0.5s;
}

#rec-indicator {
  display: none;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: #e33;
  letter-spacing: 0.1em;
}
#rec-indicator.active { display: flex; }

#rec-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: #e33;
  animation: pulse 1s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.25; }
}

#fluoro-status {
  font-size: 11px;
  letter-spacing: 0.15em;
  color: #444;
  transition: color 0.05s;
}
#fluoro-status.on { color: #4f8; }

/* --- Bottom bar --- */
#bottom-bar {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  display: flex;
  justify-content: center;
  gap: 12px;
  padding: 14px 18px;
  z-index: 20;
  transition: opacity 0.5s;
}

.ctrl-btn {
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.13);
  color: #888;
  padding: 9px 22px;
  font: inherit;
  font-size: 11px;
  letter-spacing: 0.08em;
  cursor: pointer;
  border-radius: 3px;
  transition: color 0.15s, border-color 0.15s;
}
.ctrl-btn:active { background: rgba(255,255,255,0.13); }
.ctrl-btn.rec-active {
  color: #e33;
  border-color: rgba(238,51,51,0.35);
}
.ctrl-btn.inv-active {
  color: #4f8;
  border-color: rgba(79,255,136,0.25);
}

/* --- Save overlay --- */
#save-overlay {
  display: none;
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.88);
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  z-index: 30;
}
#save-overlay.active { display: flex; }

#save-overlay .label {
  color: #aaa;
  font-size: 13px;
  letter-spacing: 0.1em;
}

#save-overlay .btn-row {
  display: flex;
  gap: 14px;
}

.save-btn {
  background: none;
  border: 1px solid rgba(79,255,136,0.3);
  color: #4f8;
  padding: 10px 28px;
  font: inherit;
  font-size: 12px;
  letter-spacing: 0.08em;
  cursor: pointer;
  border-radius: 3px;
}

.discard-btn {
  background: none;
  border: 1px solid rgba(255,255,255,0.13);
  color: #888;
  padding: 10px 28px;
  font: inherit;
  font-size: 12px;
  letter-spacing: 0.08em;
  cursor: pointer;
  border-radius: 3px;
}
</style>
</head>
<body>

<!-- Start Screen -->
<div id="start-screen">
  <div class="app-title">Fluoroscopy Simulator</div>
  <button id="btn-start">Start</button>
  <div class="hint">
    カメラが起動したら、フットスイッチ（任意のキー）を<br>
    踏んでいる間だけ透視画像が表示されます
  </div>
  <div class="hint" style="color:#333; margin-top:4px">
    R = 録画ON/OFF &nbsp; I = 明暗反転
  </div>
</div>

<!-- Error Screen -->
<div id="error-screen">
  <div id="error-msg"></div>
  <button class="ctrl-btn" onclick="resetToStart()">戻る</button>
</div>

<!-- Live Screen -->
<div id="live-screen">
  <video id="camera" autoplay playsinline muted></video>

  <div id="standby-label"><span>standby</span></div>

  <div id="top-bar">
    <div id="rec-indicator"><div id="rec-dot"></div>REC</div>
    <div id="fluoro-status">○ STANDBY</div>
  </div>

  <div id="bottom-bar">
    <button class="ctrl-btn" id="btn-rec" onclick="toggleRecording()">● Rec</button>
    <button class="ctrl-btn" id="btn-inv" onclick="toggleInvert()">Normal</button>
  </div>

  <div id="save-overlay">
    <div class="label">録画完了</div>
    <div class="btn-row">
      <button class="save-btn" onclick="saveRecording()">保存</button>
      <button class="discard-btn" onclick="discardRecording()">破棄</button>
    </div>
  </div>
</div>

<script>
// --- State ---
let stream = null;
let isExposing = false;
let isRecording = false;
let inverted = false;
let mediaRecorder = null;
let chunks = [];
let recordedBlob = null;
let controlTimer = null;

// --- DOM ---
const $ = (id) => document.getElementById(id);
const startScreen = $('start-screen');
const errorScreen = $('error-screen');
const liveScreen  = $('live-screen');
const camera      = $('camera');
const standby     = $('standby-label');
const fluoroSt    = $('fluoro-status');
const recInd      = $('rec-indicator');
const btnRec      = $('btn-rec');
const btnInv      = $('btn-inv');
const topBar      = $('top-bar');
const bottomBar   = $('bottom-bar');
const saveOvl     = $('save-overlay');

// --- Screen transitions ---
function showScreen(name) {
  startScreen.style.display = name === 'start' ? 'flex' : 'none';
  errorScreen.style.display = name === 'error' ? 'flex' : 'none';
  liveScreen.style.display  = name === 'live'  ? 'block' : 'none';
}

function resetToStart() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  showScreen('start');
}

// --- Start ---
$('btn-start').addEventListener('click', async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width:     { ideal: 1920 },
        height:    { ideal: 1080 },
        frameRate: { ideal: 30 }
      },
      audio: false
    });
    camera.srcObject = stream;
    await camera.play();
    showScreen('live');
    resetControlTimer();
  } catch (err) {
    let msg;
    if (err.name === 'NotAllowedError')
      msg = 'カメラの使用が許可されませんでした。\nブラウザの設定からカメラへのアクセスを許可してください。';
    else if (err.name === 'NotFoundError')
      msg = 'カメラが見つかりません。\nカメラ付きのデバイスで開いてください。';
    else
      msg = 'カメラエラー: ' + err.message;
    $('error-msg').textContent = msg;
    showScreen('error');
  }
});

// --- Exposure (foot switch) ---
function setExposure(on) {
  isExposing = on;
  camera.classList.toggle('exposing', on);
  standby.classList.toggle('hidden', on);
  fluoroSt.textContent = on ? '● FLUORO' : '○ STANDBY';
  fluoroSt.classList.toggle('on', on);
}

// --- Key events ---
document.addEventListener('keydown', (e) => {
  if (liveScreen.style.display === 'none') return;
  if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Escape') return;
  if (e.key === 'r' || e.key === 'R') return;
  if (e.key === 'i' || e.key === 'I') return;
  e.preventDefault();
  setExposure(true);
});

document.addEventListener('keyup', (e) => {
  if (liveScreen.style.display === 'none') return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Escape') return;

  if (e.key === 'r' || e.key === 'R') { toggleRecording(); return; }
  if (e.key === 'i' || e.key === 'I') { toggleInvert(); return; }

  setExposure(false);
});

// --- Invert ---
function toggleInvert() {
  inverted = !inverted;
  camera.classList.toggle('inverted', inverted);
  btnInv.textContent = inverted ? 'Inverted' : 'Normal';
  btnInv.classList.toggle('inv-active', inverted);
}

// --- Recording ---
function toggleRecording() {
  if (!stream) return;

  if (!isRecording) {
    chunks = [];
    try {
      mediaRecorder = new MediaRecorder(stream);
    } catch (e) {
      console.error('MediaRecorder failed:', e);
      return;
    }
    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) chunks.push(e.data);
    };
    mediaRecorder.onstop = () => {
      const mime = mediaRecorder.mimeType || 'video/mp4';
      recordedBlob = new Blob(chunks, { type: mime });
      saveOvl.classList.add('active');
    };
    mediaRecorder.start(1000);
    isRecording = true;
    recInd.classList.add('active');
    btnRec.textContent = '■ Stop';
    btnRec.classList.add('rec-active');
  } else {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.stop();
    }
    isRecording = false;
    recInd.classList.remove('active');
    btnRec.textContent = '● Rec';
    btnRec.classList.remove('rec-active');
  }
}

async function saveRecording() {
  if (!recordedBlob) return;
  const ext = recordedBlob.type.includes('mp4') ? 'mp4' : 'webm';
  const ts = new Date().toISOString().slice(0, 19).replace(/[T:]/g, '-');
  const name = `practice-${ts}.${ext}`;
  const file = new File([recordedBlob], name, { type: recordedBlob.type });

  // Try Web Share API first (works well on iOS Safari)
  try {
    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Practice Recording' });
      discardRecording();
      return;
    }
  } catch (_) { /* share cancelled or failed */ }

  // Fallback: download link
  const url = URL.createObjectURL(recordedBlob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  discardRecording();
}

function discardRecording() {
  recordedBlob = null;
  saveOvl.classList.remove('active');
}

// --- Auto-hide controls ---
function resetControlTimer() {
  bottomBar.style.opacity = '1';
  clearTimeout(controlTimer);
  controlTimer = setTimeout(() => { bottomBar.style.opacity = '0'; }, 4000);
}

document.addEventListener('pointermove', () => {
  if (liveScreen.style.display !== 'none') resetControlTimer();
});
document.addEventListener('pointerdown', () => {
  if (liveScreen.style.display !== 'none') resetControlTimer();
});
</script>
</body>
</html>
